AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Ultra-Expensive SAM Template - WARNING: This will incur MASSIVE serverless costs!"

# Global settings for all functions
Globals:
  Function:
    Timeout: 900 # Maximum timeout for higher costs
    MemorySize: 10240 # Maximum memory allocation (10GB)
    Runtime: python3.11
    Environment:
      Variables:
        EXPENSIVE_MODE: "true"
        COST_WARNING: "ULTRA_HIGH"

Parameters:
  Environment:
    Type: String
    Default: expensive-serverless
    Description: Environment name for resource naming

  ApiStageName:
    Type: String
    Default: prod
    Description: API Gateway stage name

Resources:
  # Ultra-expensive Lambda functions with maximum memory and long timeouts

  # High-memory data processing function
  ExpensiveDataProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-expensive-data-processor"
      CodeUri: src/data-processor/
      Handler: app.lambda_handler
      Runtime: python3.11
      MemorySize: 10240 # 10GB - Maximum possible
      Timeout: 900 # 15 minutes - Maximum for Lambda
      ReservedConcurrencyLimit: 1000 # High concurrency for cost
      Environment:
        Variables:
          PROCESSING_MODE: heavy
          MEMORY_INTENSIVE: "true"
      Events:
        ProcessingApi:
          Type: Api
          Properties:
            RestApiId: !Ref ExpensiveApi
            Path: /process
            Method: post
        # S3 trigger for automatic expensive processing
        S3Trigger:
          Type: S3
          Properties:
            Bucket: !Ref ExpensiveS3Bucket
            Events: s3:ObjectCreated:*
        # SQS trigger for queue processing
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ExpensiveSQSQueue.Arn
            BatchSize: 10

  # AI/ML inference function with maximum resources
  ExpensiveMLInferenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-ml-inference"
      CodeUri: src/ml-inference/
      Handler: inference.lambda_handler
      Runtime: python3.11
      MemorySize: 10240
      Timeout: 900
      ReservedConcurrencyLimit: 500
      Environment:
        Variables:
          MODEL_SIZE: large
          INFERENCE_MODE: gpu_simulation
      Events:
        InferenceApi:
          Type: Api
          Properties:
            RestApiId: !Ref ExpensiveApi
            Path: /inference
            Method: post
        # EventBridge schedule for continuous expensive inference
        ScheduledInference:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute) # Runs every minute!
            Input: '{"batch_size": 1000}'

  # Real-time analytics function
  ExpensiveAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-real-time-analytics"
      CodeUri: src/analytics/
      Handler: analytics.lambda_handler
      Runtime: python3.11
      MemorySize: 8192
      Timeout: 600
      ReservedConcurrencyLimit: 300
      Events:
        AnalyticsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ExpensiveApi
            Path: /analytics
            Method: get
        # Kinesis stream processing
        KinesisStream:
          Type: Kinesis
          Properties:
            Stream: !GetAtt ExpensiveKinesisStream.Arn
            StartingPosition: LATEST
            BatchSize: 100

  # Image processing function
  ExpensiveImageProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-image-processor"
      CodeUri: src/image-processor/
      Handler: processor.lambda_handler
      Runtime: python3.11
      MemorySize: 10240
      Timeout: 900
      ReservedConcurrencyLimit: 200
      Events:
        ImageApi:
          Type: Api
          Properties:
            RestApiId: !Ref ExpensiveApi
            Path: /images
            Method: post

  # WebSocket API for real-time expensive operations
  ExpensiveWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${Environment}-expensive-websocket-api"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  ExpensiveWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ExpensiveWebSocketApi
      StageName: !Ref ApiStageName
      AutoDeploy: true

  # REST API Gateway with expensive features
  ExpensiveApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${Environment}-expensive-api"
      StageName: !Ref ApiStageName
      TracingEnabled: true # X-Ray tracing adds cost
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          CachingEnabled: true
          CacheTtlInSeconds: 300
          CacheKeyParameters:
            - method.request.header.Authorization
      # Request/Response caching for additional costs
      CacheClusterEnabled: true
      CacheClusterSize: 6.1 # Largest cache cluster

  # Ultra-expensive DynamoDB tables with provisioned throughput
  ExpensiveUserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Environment}-expensive-users"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 10000 # Very high read capacity
        WriteCapacityUnits: 5000 # Very high write capacity
      GlobalSecondaryIndexes:
        - IndexName: UserEmailIndex
          Keys:
            - AttributeName: email
              KeyType: HASH
          ProvisionedThroughput:
            ReadCapacityUnits: 5000
            WriteCapacityUnits: 2000
          Projection:
            ProjectionType: ALL
        - IndexName: UserStatusIndex
          Keys:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          ProvisionedThroughput:
            ReadCapacityUnits: 3000
            WriteCapacityUnits: 1000
          Projection:
            ProjectionType: ALL
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: false

  ExpensiveTransactionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Environment}-expensive-transactions"
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 15000 # Ultra-high read capacity
        WriteCapacityUnits: 8000 # Ultra-high write capacity
      GlobalSecondaryIndexes:
        - IndexName: TransactionDateIndex
          Keys:
            - AttributeName: transaction_date
              KeyType: HASH
            - AttributeName: amount
              KeyType: RANGE
          ProvisionedThroughput:
            ReadCapacityUnits: 8000
            WriteCapacityUnits: 4000
          Projection:
            ProjectionType: ALL
      AttributeDefinitions:
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: transaction_date
          AttributeType: S
        - AttributeName: amount
          AttributeType: N
      KeySchema:
        - AttributeName: transaction_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Expensive Kinesis Data Streams
  ExpensiveKinesisStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub "${Environment}-expensive-kinesis-stream"
      ShardCount: 100 # Very high shard count for maximum cost
      RetentionPeriodHours: 168 # 7 days retention
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  # Kinesis Analytics Application for real-time processing
  ExpensiveKinesisAnalyticsApplication:
    Type: AWS::KinesisAnalytics::Application
    Properties:
      ApplicationName: !Sub "${Environment}-expensive-analytics-app"
      ApplicationDescription: "Expensive real-time analytics application"
      Inputs:
        - NamePrefix: "expensive_input"
          InputSchema:
            RecordColumns:
              - Name: "timestamp"
                SqlType: "TIMESTAMP"
                Mapping: "$.timestamp"
              - Name: "user_id"
                SqlType: "VARCHAR(64)"
                Mapping: "$.user_id"
              - Name: "event_type"
                SqlType: "VARCHAR(32)"
                Mapping: "$.event_type"
              - Name: "amount"
                SqlType: "DOUBLE"
                Mapping: "$.amount"
            RecordFormat:
              RecordFormatType: "JSON"
              MappingParameters:
                JSONMappingParameters:
                  RecordRowPath: "$"
          KinesisStreamsInput:
            ResourceARN: !GetAtt ExpensiveKinesisStream.Arn
            RoleARN: !GetAtt KinesisAnalyticsRole.Arn

  # SQS Queues with expensive features
  ExpensiveSQSQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-expensive-processing-queue"
      VisibilityTimeoutSeconds: 900
      MessageRetentionPeriod: 1209600 # 14 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExpensiveDeadLetterQueue.Arn
        maxReceiveCount: 3

  ExpensiveDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-expensive-dlq"
      MessageRetentionPeriod: 1209600

  # S3 Bucket with expensive storage classes and features
  ExpensiveS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Environment}-expensive-storage-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpensiveStorageRule
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 1
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 1
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ExpensiveDataProcessorFunction.Arn
      LoggingConfiguration:
        DestinationBucketName: !Ref ExpensiveLoggingBucket
        LogFilePrefix: access-logs/
      AccelerateConfiguration:
        AccelerationStatus: Enabled # Transfer acceleration adds cost

  ExpensiveLoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Environment}-expensive-logging-${AWS::AccountId}"

  # CloudFront Distribution with expensive features
  ExpensiveCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${Environment} Expensive CloudFront Distribution"
        DefaultCacheBehavior:
          TargetOriginId: ExpensiveS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
        Origins:
          - Id: ExpensiveS3Origin
            DomainName: !GetAtt ExpensiveS3Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
        Enabled: true
        PriceClass: PriceClass_All # Global edge locations (most expensive)
        HttpVersion: http2
        IPV6Enabled: true

  # Step Functions for expensive workflow orchestration
  ExpensiveStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${Environment}-expensive-workflow"
      DefinitionString: !Sub |
        {
          "Comment": "Expensive serverless workflow",
          "StartAt": "ExpensiveParallelProcessing",
          "States": {
            "ExpensiveParallelProcessing": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "DataProcessing",
                  "States": {
                    "DataProcessing": {
                      "Type": "Task",
                      "Resource": "${ExpensiveDataProcessorFunction.Arn}",
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "MLInference",
                  "States": {
                    "MLInference": {
                      "Type": "Task",
                      "Resource": "${ExpensiveMLInferenceFunction.Arn}",
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "Analytics",
                  "States": {
                    "Analytics": {
                      "Type": "Task",
                      "Resource": "${ExpensiveAnalyticsFunction.Arn}",
                      "End": true
                    }
                  }
                }
              ],
              "End": true
            }
          }
        }
      RoleArn: !GetAtt StepFunctionsRole.Arn

  # EventBridge rules for expensive event-driven architecture
  ExpensiveEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Environment}-expensive-event-rule"
      Description: "Rule for expensive event processing"
      EventPattern:
        source: ["myapp.expensive"]
        detail-type: ["Expensive Event"]
      Targets:
        - Arn: !GetAtt ExpensiveDataProcessorFunction.Arn
          Id: "ExpensiveTarget1"
        - Arn: !GetAtt ExpensiveMLInferenceFunction.Arn
          Id: "ExpensiveTarget2"
        - Arn: !GetAtt ExpensiveStateMachine.Arn
          Id: "ExpensiveTarget3"
          RoleArn: !GetAtt EventBridgeRole.Arn

  # IAM Roles
  KinesisAnalyticsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: kinesisanalytics.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KinesisAnalyticsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:DescribeStream
                  - kinesis:GetShardIterator
                  - kinesis:GetRecords
                Resource: !GetAtt ExpensiveKinesisStream.Arn

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ExpensiveDataProcessorFunction.Arn
                  - !GetAtt ExpensiveMLInferenceFunction.Arn
                  - !GetAtt ExpensiveAnalyticsFunction.Arn

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - states:StartExecution
                Resource: "*"

Outputs:
  CostWarning:
    Description: "CRITICAL COST WARNING"
    Value: |
      🚨 ULTRA-EXPENSIVE SERVERLESS INFRASTRUCTURE 🚨

      💰 Estimated Monthly Costs:
      - Lambda (10GB memory, high concurrency): $50,000-100,000+
      - DynamoDB (provisioned throughput): $15,000-25,000+
      - Kinesis Data Streams (100 shards): $10,000-15,000+
      - API Gateway (with caching): $5,000-10,000+
      - S3 + CloudFront + Transfer: $2,000-5,000+
      - Step Functions + EventBridge: $1,000-3,000+

      💸 TOTAL ESTIMATED: $80,000-160,000+ PER MONTH

      ⚠️ DELETE IMMEDIATELY AFTER TESTING!

  ApiGatewayUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ExpensiveApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/"

  WebSocketApiUrl:
    Description: "WebSocket API endpoint URL"
    Value: !Sub "wss://${ExpensiveWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/"

  DynamoDBUserTable:
    Description: "DynamoDB User Table Name"
    Value: !Ref ExpensiveUserTable

  DynamoDBTransactionTable:
    Description: "DynamoDB Transaction Table Name"
    Value: !Ref ExpensiveTransactionTable

  KinesisStreamName:
    Description: "Kinesis Stream Name"
    Value: !Ref ExpensiveKinesisStream

  S3BucketName:
    Description: "S3 Bucket Name"
    Value: !Ref ExpensiveS3Bucket

  CloudFrontDomainName:
    Description: "CloudFront Distribution Domain Name"
    Value: !GetAtt ExpensiveCloudFrontDistribution.DomainName

  StateMachineArn:
    Description: "Step Functions State Machine ARN"
    Value: !Ref ExpensiveStateMachine

  TotalWarning:
    Description: "FINAL WARNING"
    Value: |
      🔥 This SAM template creates serverless resources that will cost
      $80,000-160,000+ PER MONTH if left running with heavy usage!

      🛑 DESTROY IMMEDIATELY: sam delete --stack-name <your-stack-name>
      📊 Monitor AWS Billing Dashboard constantly!
      💳 Set up billing alerts before deployment!
